    // Helper para requisições autenticadas ao Supabase
    async function supabaseFetch(endpoint, options = {}) {
        const url = `${SUPABASE_URL}/${endpoint}`;
        const headers = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            ...options.headers
        };
        const response = await fetch(url, { ...options, headers });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Erro ${response.status}: ${errorText}`);
        }
        return response.json();
    }

    // ============================================================

    // Configurações padrão para Gráficos (mantidas do original)
    Chart.register(ChartDataLabels);
    Chart.defaults.plugins.datalabels = {
        display: function(context) {
            return context.dataset && context.dataset.type !== 'line' && context.chart.config.type !== 'line';
        },
        anchor: 'center',
        align: 'center',
        clamp: true,
        clip: false,
        offset: 0,
        color: function() {
            return document.body.classList.contains('dark-mode') ? '#ffffff' : '#000000';
        },
        font: { weight: '700', size: 10 },
        formatter: function(value, context) {
            const label = context.dataset && context.dataset.label ? context.dataset.label : '';
            const num = Number(value);
            if (!Number.isFinite(num)) return '';
            if (label.includes('(R$)') || label.includes('R$')) {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(num);
            }
            if (label.includes('(%)') || label.includes('Aderência') || label.includes('Meta')) return `${num}%`;
            if (label.includes('Horas') || label.includes('Atravessamento') || label.includes('Backlog')) return hoursToHHMM(num);
            return Number.isInteger(num) ? String(num) : num.toFixed(1);
        }
    };

    const standard100ScaleOptions = {

    const formatCurrency = (val) => {
        return (parseFloat(val) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const hoursToHHMM = (val) => {
        const num = Number(val);
        if (!Number.isFinite(num)) return '';
        const totalMinutes = Math.max(0, Math.round(num * 60));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    };

    const hhmmToHours = (val) => {
        const raw = String(val ?? '').trim();
        if (!raw) return '';
        if (raw.includes(':')) {
            const parts = raw.split(':');
            const h = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            if (Number.isFinite(h) && Number.isFinite(m)) return h + (m / 60);
        }

    function toggleAudioReading() {
        if (!('speechSynthesis' in window)) return;
        const t = i18n[currentLang];

            window.speechSynthesis.cancel();
            isSpeaking = false;
            document.getElementById('audio-icon').innerText = '🔊';
            document.getElementById('audio-text').innerText = t.audioStart;
        } else {
            window.speechSynthesis.cancel();
            const textToRead = document.querySelector('main').innerText;
            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = currentLang === 'pt' ? 'pt-BR' : currentLang === 'en' ? 'en-US' : 'es-ES';
            utterance.onend = function() {
                isSpeaking = false;
                document.getElementById('audio-icon').innerText = '🔊';
                document.getElementById('audio-text').innerText = t.audioStart;
            };
            window.speechSynthesis.speak(utterance);
            isSpeaking = true;
            document.getElementById('audio-icon').innerText = '⏹️';
            document.getElementById('audio-text').innerText = t.audioStop;
        }
    }

    function initCalendarOptions() {
        const select = document.getElementById('cal-year-select');
        select.innerHTML = '';
        const startYear = currentCalYear - 2;
        for (let y = startYear; y <= startYear + 5; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.innerText = y;
            if (y === currentCalYear) opt.selected = true;
            select.appendChild(opt);
        }
        renderCalendar();
    }

    function navigateCalendar(direction) {
        currentCalSemester += direction;
        if (currentCalSemester > 1) {
            currentCalSemester = 0;
            currentCalYear++;
        } else if (currentCalSemester < 0) {
            currentCalSemester = 1;
            currentCalYear--;
        }
        document.getElementById('cal-year-select').value = currentCalYear;
        renderCalendar();
    }

    function renderCalendar() {
        const selectYear = parseInt(document.getElementById('cal-year-select').value, 10);
        if (!isNaN(selectYear)) currentCalYear = selectYear;
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        const startMonth = currentCalSemester * 6;
        const endMonth = startMonth + 5;
        document.getElementById('cal-semester-label').innerText = 
            `${monthNamesShort[startMonth]} - ${monthNamesShort[endMonth]} (${currentCalYear})`;
        for (let m = startMonth; m <= endMonth; m++) {
            const col = document.createElement('div');
            col.className = 'calendar-month-col';
            const title = document.createElement('div');
            title.className = 'calendar-month-title';
            title.innerText = monthNamesShort[m];
            col.appendChild(title);
            (window.trainings || []).forEach(t => {
                if (t.data_realizada) {
                    const [y, monthStr, d] = t.data_realizada.split('-');
                    const yearNum = parseInt(y, 10);
                    const monthIdx = parseInt(monthStr, 10) - 1;
                    if (yearNum === currentCalYear && monthIdx === m) {
                        const eventBox = document.createElement('div');
                        eventBox.className = 'calendar-event';
                        const dayFormatted = `${d.padStart(2, '0')}/${(monthIdx + 1).toString().padStart(2, '0')}`;
                        eventBox.innerText = `${t.nome} ${dayFormatted}`;
                        col.appendChild(eventBox);
                    }
                }
            });
            grid.appendChild(col);
        }
    }

    function calculateNextDate(startDateStr, duracao) {
        if (!startDateStr) return null;
        const date = new Date(startDateStr + "T00:00:00");
        if (duracao === "6 meses") date.setMonth(date.getMonth() + 6);
        else if (duracao === "1 ano") date.setFullYear(date.getFullYear() + 1);
        else if (duracao === "2 anos") date.setFullYear(date.getFullYear() + 2);
        return date;
    }

    function formatDateBR(dateObj) {
        if (!dateObj || isNaN(dateObj.getTime())) return "-";
        return dateObj.toLocaleDateString('pt-BR');
    }

    function renderTrainings() {
        const container = document.getElementById('trainings-list');
        container.innerHTML = '';
        const nameFilter = document.getElementById('filter-train-name').value.toLowerCase();
        const groupFilter = document.getElementById('filter-train-group').value;
        const durationFilter = document.getElementById('filter-train-duration').value;
        let nextExpiringCourse = null;
        let minNextDate = Infinity;
        const filtered = (window.trainings || []).filter(t => {
            const matchesName = t.nome.toLowerCase().includes(nameFilter);
            const matchesGroup = groupFilter === "" || t.grupo === groupFilter;
            const matchesDuration = durationFilter === "" || t.duracao === durationFilter;
            return matchesName && matchesGroup && matchesDuration;
        });
        (window.trainings || []).forEach(t => {
            const nextDate = calculateNextDate(t.data_realizada, t.duracao);
            if (nextDate && nextDate.getTime() < minNextDate) {
                minNextDate = nextDate.getTime();
                nextExpiringCourse = { ...t, calculatedNextDate: nextDate };
            }
        });
        if (nextExpiringCourse) {
            document.getElementById('next-expiring-course').innerText = nextExpiringCourse.nome;
            document.getElementById('next-expiring-date').innerText = `Vencimento: ${formatDateBR(nextExpiringCourse.calculatedNextDate)}`;
        } else {
            document.getElementById('next-expiring-course').innerText = "Nenhum curso cadastrado";
            document.getElementById('next-expiring-date').innerText = "Data: -";
        }
        if (filtered.length === 0) {
            container.innerHTML = `<div class="placeholder-box"><p>Nenhum treinamento encontrado.</p></div>`;
            return;
        }
        filtered.forEach(t => {
            const lastDate = t.data_realizada ? t.data_realizada.split('-').reverse().join('/') : '-';
            const nextDateObj = calculateNextDate(t.data_realizada, t.duracao);
            const nextDateFormatted = formatDateBR(nextDateObj);
            const row = document.createElement('div');
            row.className = 'training-row';
            row.onclick = () => openTrainingModal(t.id);
            row.innerHTML = `
                <div class="training-title">${t.nome}</div>

                    <span>Grupo: <span class="badge-group">${t.grupo}</span></span>

                    <span>Duração: <strong>${t.duracao}</strong></span>
                    <span>Próximo: <strong>${nextDateFormatted}</strong></span>
                </div>
            `;
            container.appendChild(row);
        });
        renderCalendar();
    }

    function renderPlanejamento() {
        const getSeriesData = (subId, fieldName) => {
            const dataset = window.planningData && window.planningData[subId] ? window.planningData[subId] : {};
            const months = Object.keys(dataset);
            return months.map(m => parseFloat(dataset[m][fieldName]) || 0);
        };
        const getMonthsList = (subId) => {
            const dataset = window.planningData && window.planningData[subId] ? window.planningData[subId] : {};
            const keys = Object.keys(dataset);
            return keys.map(k => k.split(' ')[0]);
        };
        const calculateAverage = (arr) => {
            if (!arr.length) return 0;
            const sum = arr.reduce((acc, cur) => acc + cur, 0);
            return (sum / arr.length).toFixed(1);
        };
        const pmpVals = getSeriesData('pmp', 'Resultado');
        const prevVals = getSeriesData('prev_corr', 'Preventiva');
        const hhVals = getSeriesData('hh', 'Aderência');
        const absVals = getSeriesData('absenteismo', 'Faltas');
        const avgPmp = calculateAverage(pmpVals);
        const avgPrev = calculateAverage(prevVals);
        const avgHh = calculateAverage(hhVals);
        const avgAbs = absVals.length ? (absVals.reduce((acc, cur) => acc + cur, 0) / 12).toFixed(1) : '0.0';
        document.getElementById('kpi-pmp-val').innerText = `${avgPmp}%`;
        document.getElementById('kpi-prev-val').innerText = `${avgPrev}%`;
        document.getElementById('kpi-hh-val').innerText = `${avgHh}%`;
        document.getElementById('kpi-abs-val').innerText = `${avgAbs}%`;
        const updateCardStatus = (cardId, currentVal, metaVal, isInverse = false) => {
            const card = document.getElementById(cardId);
            card.classList.remove('status-green', 'status-yellow', 'status-red');
            if (!isInverse) {
                if (currentVal >= metaVal) card.classList.add('status-green');
                else if (currentVal >= metaVal * 0.8) card.classList.add('status-yellow');

    // ABRIR GRÁFICO AMPLIADO
    let activeChartModal = null;
    let activeChartCanvas = null;
    let activeChartPlaceholder = null;
    let activeChartOriginalParent = null;

    function ensureChartModal() {
        let modal = document.getElementById('chart-modal');
        if (modal) return modal;
        modal = document.createElement('div');
        modal.id = 'chart-modal';
        modal.className = 'chart-modal';
        modal.setAttribute('role', 'dialog');
        modal.setAttribute('aria-modal', 'true');
        modal.innerHTML = `
            <div class="chart-modal-content">
                <div class="chart-modal-header">
                    <div class="chart-modal-title" id="chart-modal-title">Gráfico</div>
                    <button type="button" class="chart-modal-close" id="chart-modal-close">Fechar</button>
                </div>
                <div class="chart-modal-body" id="chart-modal-body"></div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeChartModal();
        });
        modal.querySelector('#chart-modal-close').addEventListener('click', closeChartModal);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && activeChartModal) closeChartModal();
        });
        return modal;
    }

    function getChartTitle(chartBox, canvas) {
        const heading = chartBox.querySelector('h4, h3, h2');
        if (heading && heading.textContent.trim()) return heading.textContent.trim();
        return canvas.getAttribute('aria-label') || 'Gráfico';
    }

    function openChartModal(canvas) {
        const chart = Chart.getChart(canvas);
        if (!chart) return;
        closeChartModal();
        const modal = ensureChartModal();
        const body = modal.querySelector('#chart-modal-body');
        const title = modal.querySelector('#chart-modal-title');
        const parent = canvas.parentElement;
        activeChartModal = modal;
        activeChartCanvas = canvas;
        activeChartOriginalParent = parent;
        activeChartPlaceholder = document.createElement('span');
        activeChartPlaceholder.className = 'chart-canvas-placeholder';
        activeChartPlaceholder.style.display = 'block';
        activeChartPlaceholder.style.width = '100%';
        activeChartPlaceholder.style.height = '240px';
        activeChartPlaceholder.setAttribute('aria-hidden', 'true');
        parent.insertBefore(activeChartPlaceholder, canvas);
        body.appendChild(canvas);
        title.textContent = getChartTitle(parent, canvas);
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(function() {
            chart.resize();
            chart.update('none');
        });
    }

    function closeChartModal() {
        if (!activeChartModal || !activeChartCanvas) return;
        const chart = Chart.getChart(activeChartCanvas);
        if (activeChartPlaceholder && activeChartPlaceholder.parentNode) {
            activeChartPlaceholder.parentNode.insertBefore(activeChartCanvas, activeChartPlaceholder);
            activeChartPlaceholder.remove();
        } else if (activeChartOriginalParent) {
            activeChartOriginalParent.appendChild(activeChartCanvas);
        }
        activeChartModal.classList.remove('open');
        document.body.style.overflow = '';
        requestAnimationFrame(function() {
            if (chart) {
                chart.resize();
                chart.update('none');
            }
        });
        activeChartModal = null;
        activeChartCanvas = null;
        activeChartPlaceholder = null;
        activeChartOriginalParent = null;
    }

    function addOpenChartButtons() {
        document.querySelectorAll('.chart-box').forEach(function(chartBox) {
            const canvas = chartBox.querySelector('canvas');
            if (!canvas) return;
            if (chartBox.querySelector('.chart-open-btn')) return;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'chart-open-btn';
            button.textContent = 'Abrir Gráfico';
            button.setAttribute('aria-label', 'Abrir gráfico ampliado');
            button.addEventListener('click', function() {
                openChartModal(canvas);
            });
            chartBox.insertBefore(button, canvas);
        });
    }

    // ============================================================
    // CONTROLE DE LOGIN
    // ============================================================
    const LOGIN_USER = 'ADM2026';
    const LOGIN_PASSWORD = '170431';

    function unlockSystem() {
        document.body.classList.remove('login-locked');
        document.body.classList.add('login-unlocked');
        sessionStorage.setItem('relatorio_login_autorizado', '1');
        setTimeout(function() {
            const userField = document.getElementById('login-user');
            const passwordField = document.getElementById('login-password');
            if (userField) userField.value = '';
            if (passwordField) passwordField.value = '';
        }, 200);
    }

    function showLogin() {
        document.body.classList.remove('login-unlocked');
        document.body.classList.add('login-locked');
        const userField = document.getElementById('login-user');
        if (userField) setTimeout(() => userField.focus(), 100);
    }

    function validateLogin(event) {
        event.preventDefault();
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-password').value;
        const error = document.getElementById('login-error');
        if (username === LOGIN_USER && password === LOGIN_PASSWORD) {
            error.textContent = '';
            unlockSystem();
        } else {
            error.textContent = 'Usuário ou senha incorretos. Tente novamente.';
            document.getElementById('login-password').value = '';
            document.getElementById('login-password').focus();
        }
    }

    function initLogin() {
        const form = document.getElementById('login-form');
        const toggle = document.getElementById('toggle-login-password');
        const password = document.getElementById('login-password');
        if (form) form.addEventListener('submit', validateLogin);
        if (toggle && password) {
            toggle.addEventListener('click', function() {
                const showing = password.type === 'text';
                password.type = showing ? 'password' : 'text';
                toggle.textContent = showing ? '👁' : '🙈';
                toggle.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
            });
        }
        if (sessionStorage.getItem('relatorio_login_autorizado') === '1') {
            unlockSystem();
        } else {
            showLogin();
        }
    }
